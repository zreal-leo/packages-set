name: Publish Package

on:
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        if: github.event.head_commit && startsWith(github.event.head_commit.message, 'RELEASING')
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
            - run: pnpm ci
            - run: pnpm changeset publish
